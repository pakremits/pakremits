# Production application. Deploy this config only from the main branch.
app = "pakremits"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# Production is the one environment search engines may index. The public
# domain, not the fly.dev hostname, is canonical; next.config.ts redirects
# pakremits.fly.dev there. Both values are read at build time.
[build.args]
  NEXT_PUBLIC_SITE_URL = "https://pakremits.com"
  ROBOTS_ALLOW_INDEXING = "true"

[env]
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://pakremits.com"
  ROBOTS_ALLOW_INDEXING = "true"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
