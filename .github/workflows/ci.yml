name: CI

# Pull requests into main and pushes to main run the checks. A push to main
# (every merged PR is one) that passes them publishes staging through
# publish.yml: migrations, build from the database, deploy, smoke test.
on:
  pull_request:
    branches: [main]
  push:
    # TEMPORARY: infra/cloudflare-free runs the checks on Linux before its PR
    # opens (only main publishes). Removed with the branch's last commit.
    branches: [main, infra/cloudflare-free]
  workflow_dispatch:

# A new push to a PR cancels that PR's previous run. Each push to main gets its
# own group so every commit on main is verified; publishing queues separately.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # Naming the shell runs steps with -eo pipefail; the implicit default omits
    # pipefail, which would hide a failing command in the middle of a pipe.
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Leave NEXT_PUBLIC_SITE_URL and ROBOTS_ALLOW_INDEXING unset: the seo and
      # site-indexing tests assert the localhost defaults.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0 # keep in step with publish.yml
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests and the D1 tests, which run on an in-memory local D1.
      - run: npm test
      # The whole static build on a seeded local D1 (no live quotes: the
      # refresh needs the providers' sites), then the Worker's bundle.
      - name: Build
        run: |
          npm run db:migrate:local
          npm run seed
          npm run build
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler/dist

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply every migration to an empty database
        run: npm run db:migrate:local
      - name: A second run applies nothing
        run: |
          out="$(npm run db:migrate:local 2>&1)"
          echo "$out"
          grep -q 'No migrations to apply' <<<"$out"
      # A schema change without its migration would deploy code the database
      # does not match.
      - name: The migrations match the schema
        run: |
          npx drizzle-kit generate --name drift-check
          git status --porcelain migrations
          [ -z "$(git status --porcelain migrations)" ] \
            || { echo "::error::lib/db/schema.ts has changes with no migration: run npm run db:generate"; exit 1; }

  # Runs can finish out of order, and "Re-run" on an old run would otherwise
  # downgrade staging: only main's tip publishes.
  tip:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, migrations]
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.guard.outputs.current }}
    steps:
      - name: Is this commit still main's tip?
        id: guard
        env:
          # Authenticated, so the check does not depend on the repository
          # being public.
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; its own run publishes it"
          fi

  # New code over the rates already in the database; the daily run refreshes.
  publish-staging:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      environment: staging
      refresh: false
    secrets: inherit
